{% extends "layouts/base.html" %}

{% block title %}Edit Vacancy - Taira{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3><i class="bi bi-briefcase me-2"></i>Edit Vacancy</h3>
            </div>
            <div class="card-body">
                <form method="post" action="/vacancies/{{ vacancy.id }}/edit">
                    <div class="mb-3">
                        <label for="title" class="form-label">Job Title *</label>
                        <input type="text" class="form-control" id="title" name="title" 
                               value="{{ vacancy.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="company_id" class="form-label">Company *</label>
                        <select class="form-select" id="company_id" name="company_id" required>
                            <option value="">Select a company...</option>
                            {% for company in companies %}
                                <option value="{{ company.id }}" 
                                        {% if company.id == vacancy.company_id %}selected{% endif %}>
                                    {{ company.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" 
                                  placeholder="Job description, requirements, etc.">{{ vacancy.description or '' }}</textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/vacancies" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Back to Vacancies
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-2"></i>Update Vacancy
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
